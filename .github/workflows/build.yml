name: Build Almajedi VIP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          "$SDK" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Tajawal fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          for f in arabic-500 arabic-800 latin-500 latin-800; do
            curl -fsSL -o app/src/main/assets/fonts/tajawal-$f-normal.woff2 https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.3.0/files/tajawal-$f-normal.woff2
          done
          ls -la app/src/main/assets/fonts

      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d app/icon/ic_launcher.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls -la app/src/main/res/mipmap-xxxhdpi

      - name: Build APK
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/release.jks.enc -out app/release.jks -pass env:KEYSTORE_PASSWORD
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk almajedi-vip.apk
          else
            echo "::warning::KEYSTORE_PASSWORD secret is missing - building an unsigned-for-release debug APK"
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk almajedi-vip.apk
          fi
          rm -f app/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Almajedi-VIP-APK
          path: almajedi-vip.apk
          if-no-files-found: error

      - name: Publish download link
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_PASSWORD != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "تطبيق المجيدي VIP" --notes "آخر نسخة من تطبيق المجيدي VIP. نزّل الملف almajedi-vip.apk وثبّته على جوالك."
          gh release upload latest almajedi-vip.apk --clobber
          gh release edit latest --notes "آخر نسخة من تطبيق المجيدي VIP (الإصدار 1.${VERSION_CODE}). نزّل الملف almajedi-vip.apk وثبّته على جوالك."
