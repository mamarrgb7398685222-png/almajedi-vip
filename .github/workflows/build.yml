name: Build Almajedi VIP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          "$SDK" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Tajawal fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          for f in arabic-500 arabic-800 latin-500 latin-800; do
            curl -fsSL -o app/src/main/assets/fonts/tajawal-$f-normal.woff2 https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.3.0/files/tajawal-$f-normal.woff2
          done
          ls -la app/src/main/assets/fonts

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Almajedi-VIP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
